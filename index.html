</style><style>
    html, body { margin: 0; padding: 0; }
    body { background: #FBF8F3; }
    #root { min-height: 100vh; }
    .mc-bootstrap {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #FBF8F3; color: #7A1F2B;
      font-family: Georgia, serif;
    }
    .mc-bootstrap-title { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
    .mc-bootstrap-sub { font-size: 13px; color: #4A413A; font-family: system-ui, sans-serif; }
    .mc-bootstrap-spinner {
      margin-top: 24px; width: 32px; height: 32px;
      border: 3px solid #E8DFD2; border-top-color: #7A1F2B; border-radius: 50%;
      animation: mc-spin 0.9s linear infinite;
    }
    @keyframes mc-spin { to { transform: rotate(360deg); } }
    .mc-bootstrap-error {
      margin-top: 24px; padding: 16px; max-width: 480px;
      background: #fff; border: 2px solid #7A1F2B; border-radius: 8px;
      font-family: system-ui, sans-serif; font-size: 13px; color: #4A413A;
      text-align: left; display: none;
    }
    .mc-bootstrap-error.visible { display: block; }
